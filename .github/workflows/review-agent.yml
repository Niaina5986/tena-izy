name: Review Agent

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: review-agent
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lancer le controle R6-R7
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python review_agent.py

      - name: Enregistrer les rapports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review_reports/
          git diff --cached --quiet || git commit -m "Add mission review reports"
          git push