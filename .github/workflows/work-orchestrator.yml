name: TENA IZY - Delivery Orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: tena-izy-delivery-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify reports
        run: python work_verifier.py
      - name: Confirm delivery on GitHub
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python work_delivery.py
      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python work_telegram_notify.py
      - name: Save pipeline state
        if: always()
        run: |
          git config user.name "TENA IZY BOT"
          git config user.email "tena-izy-bot@users.noreply.github.com"
          git add db.json
          git diff --cached --quiet || git commit -m "TENA IZY: delivery pipeline update"
          git pull --rebase origin main
          git push origin main
