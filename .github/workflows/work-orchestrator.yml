name: TENA IZY - Autonomous Orchestrator

on:
workflow_dispatch:

schedule:
- cron: "*/10 * * * *"

permissions:
contents: write
pull-requests: write

concurrency:
group: tena-izy-db
cancel-in-progress: false

jobs:
orchestrator:
runs-on: ubuntu-latest
timeout-minutes: 30

steps:
  - name: Checkout
    uses: actions/checkout@v4
    with:
      ref: main
      fetch-depth: 0
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install requests

  - name: Check GitHub authentication
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_TOKEN: ${{ github.token }}
    run: |
      if [ -n "$GH_PAT" ]; then
        echo "GH_PAT détecté."
      elif [ -n "$GITHUB_TOKEN" ]; then
        echo "GITHUB_TOKEN détecté."
      else
        echo "ERREUR : aucun token GitHub disponible."
        exit 1
      fi

  - name: Verify missions
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_TOKEN: ${{ github.token }}
    run: python work_verifier.py

  - name: Deliver missions
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_TOKEN: ${{ github.token }}
    run: python work_delivery.py

  - name: Notify Telegram
    if: always()
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    run: python work_telegram_notify.py

  - name: Save database
    if: always()
    run: |
      git config user.name "TENA IZY BOT"
      git config user.email "tena-izy-bot@users.noreply.github.com"

      git add db.json

      if git diff --cached --quiet; then
        echo "Aucune modification."
        exit 0
      fi

      git commit -m "TENA IZY: autonomous execution update"

      git fetch origin main

      if ! git merge-base --is-ancestor origin/main HEAD; then
        echo "ERREUR: branche distante modifiée."
        exit 1
      fi

      git push origin HEAD:main