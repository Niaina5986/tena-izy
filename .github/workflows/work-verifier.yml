name: TENA IZY - Work Verifier

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tena-izy-delivery-pipeline
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify completed mission reports
        run: python work_verifier.py
      - name: Save database
        run: |
          git config user.name "TENA IZY BOT"
          git config user.email "tena-izy-bot@users.noreply.github.com"
          git add db.json
          git diff --cached --quiet || git commit -m "TENA IZY: verify work reports"
          git pull --rebase origin main
          git push origin main
