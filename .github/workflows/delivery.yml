name: TENA IZY - R7 DELIVERY BOT

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: r7-delivery
  cancel-in-progress: false

jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run R7 Delivery Bot
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python delivery_bot.py

      - name: Save independent delivery database
        run: |
          git config user.name "TENA IZY R7"
          git config user.email "r7-delivery-bot@users.noreply.github.com"

          if git status --porcelain -- livraison.json | grep -q .; then
            git add livraison.json
            git commit -m "chore(r7): update delivery history"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No delivery database changes."
          fi