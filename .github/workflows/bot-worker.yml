name: TENA IZY - Autonomous Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: tena-izy-db
  cancel-in-progress: false

jobs:
  bot-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Run autonomous engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Save database changes
        run: |
          git config user.name "TENA IZY Bot"
          git config user.email "tena-izy-bot@users.noreply.github.com"
          git add db.json
          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Update TENA IZY database"
            git push origin HEAD:main
          fi