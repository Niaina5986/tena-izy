name: BOT WORKER - Autonomous Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: tena-izy-db
  cancel-in-progress: false

jobs:
  bot-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required files
        run: |
          test -f main.py
          test -f db.json
          test -f manus_worker.py

      - name: Search and analyze missions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: python main.py

      - name: Execute approved missions with Manus
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
        run: python manus_worker.py

      - name: Save database safely
        if: always()
        run: |
          git config user.name "TENA IZY BOT"
          git config user.email "tena-izy-bot@users.noreply.github.com"
          git add db.json

          if git diff --cached --quiet; then
            echo "No database changes."
            exit 0
          fi

          git commit -m "BOT WORKER: update missions"
          git fetch origin main

          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "ERROR: Remote branch changed unexpectedly."
            exit 1
          fi

          git push origin HEAD:main