name: TENA IZY - Delivery Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: tena-izy-database
  cancel-in-progress: false

jobs:
  delivery:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # RÉCUPÉRER LE PROJET
      # ==========================================

      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # INSTALLER PYTHON
      # ==========================================

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # INSTALLER LES DÉPENDANCES
      # ==========================================

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ==========================================
      # PRÉPARER LE DOSSIER
      # ==========================================

      - name: Préparer les dossiers
        run: |
          mkdir -p deliveries

      # ==========================================
      # EXÉCUTER LE DELIVERY AGENT
      # ==========================================

      - name: Vérifier et récupérer les livraisons
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python delivery_agent.py

      # ==========================================
      # SAUVEGARDER LES FICHIERS
      # ==========================================

      - name: Sauvegarder les livraisons dans GitHub
        run: |
          git config user.name "TENA IZY"
          git config user.email "actions@github.com"

          mkdir -p deliveries

          git add -A -- deliveries/ db.json

          if git diff --cached --quiet; then
            echo "Aucune nouvelle livraison à sauvegarder."
            exit 0
          fi

          git commit -m "TENA IZY: archive des livraisons"

          BRANCH="${GITHUB_REF_NAME}"

          for i in 1 2 3 4 5; do

            git fetch origin "$BRANCH"

            git rebase "origin/$BRANCH"

            if git push origin "HEAD:$BRANCH"; then
              echo "Archivage GitHub réussi."
              exit 0
            fi

            echo "Nouvelle tentative $i..."
            sleep 5

          done

          echo "Échec de sauvegarde après 5 tentatives."
          exit 1