name: TENA IZY - Delivery Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: tena-izy-database
  cancel-in-progress: false

jobs:
  delivery:
    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Lancer le Delivery Agent
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python delivery_agent.py

      - name: Sauvegarder les livrables
        run: |
          git config user.name "TENA IZY"
          git config user.email "actions@github.com"

          git add db.json deliveries/

          if git diff --cached --quiet; then
            echo "Aucune nouvelle livraison."
            exit 0
          fi

          git commit -m "TENA IZY: archive delivered files"

          BRANCH="${GITHUB_REF_NAME}"

          for i in 1 2 3 4 5; do

            git fetch origin "$BRANCH"

            git rebase "origin/$BRANCH"

            if git push origin "HEAD:$BRANCH"; then
              echo "Archivage GitHub réussi."
              exit 0
            fi

            echo "Nouvelle tentative $i..."
            sleep 3

          done

          echo "Échec de sauvegarde."
          exit 1