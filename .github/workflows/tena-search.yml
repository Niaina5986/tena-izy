name: TENA IZY - Recherche

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: tena-izy-database
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Rechercher les missions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_REWARD_USD: "5"
        run: python main.py

      - name: Sauvegarder les résultats
        run: |
          git config user.name "TENA IZY"
          git config user.email "actions@github.com"

          git add db.json

          if git diff --cached --quiet; then
            echo "Aucune modification."
            exit 0
          fi

          git commit -m "TENA IZY: missions found"

          BRANCH="${GITHUB_REF_NAME}"

          for i in 1 2 3 4 5; do

            git fetch origin "$BRANCH"

            git rebase "origin/$BRANCH"

            if git push origin "HEAD:$BRANCH"; then
              echo "Sauvegarde réussie."
              exit 0
            fi

            echo "Nouvelle tentative $i..."
            sleep 3

          done

          echo "Échec de sauvegarde."
          exit 1