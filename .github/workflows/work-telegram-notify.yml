name: TENA IZY - Telegram Notifications

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tena-izy-db
  cancel-in-progress: false

jobs:
  telegram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python work_telegram_notify.py

      - name: Save database
        run: |
          git config user.name "TENA IZY BOT"
          git config user.email "tena-izy-bot@users.noreply.github.com"

          git add db.json

          if git diff --cached --quiet; then
            echo "Aucune modification."
            exit 0
          fi

          git commit -m "TENA IZY: update Telegram status"
          git push origin HEAD:main