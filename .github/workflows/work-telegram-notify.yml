name: TENA IZY - Telegram Delivery Notifications

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tena-izy-delivery-pipeline
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send Telegram delivery cards
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python work_telegram_notify.py
      - name: Save notification state
        run: |
          git config user.name "TENA IZY BOT"
          git config user.email "tena-izy-bot@users.noreply.github.com"
          git add db.json
          git diff --cached --quiet || git commit -m "TENA IZY: record Telegram notifications"
          git pull --rebase origin main
          git push origin main
