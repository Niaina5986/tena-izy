name: TENA IZY - Automatic Approval

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: tena-izy-db
  cancel-in-progress: false

jobs:
  automatic-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Automatically approve suitable missions
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_approval.py

      - name: Save database changes
        run: |
          git config user.name "TENA IZY Bot"
          git config user.email "tena-izy-bot@users.noreply.github.com"
          git add db.json
          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Automatic mission approval"
            git push origin HEAD:main
          fi