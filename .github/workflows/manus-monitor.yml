name: MANUS MONITOR

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: bot-worker
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify files
        run: |
          test -f db.json
          test -f manus_monitor.py

      - name: Run Manus Monitor
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python manus_monitor.py

      - name: Save database
        if: always()
        run: |
          git config user.name "BOT WORKER"
          git config user.email "bot-worker@users.noreply.github.com"

          git add db.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Manus monitoring"
          fi

          git pull --rebase origin main
          git push origin main