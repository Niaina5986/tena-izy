name: MANUS MONITOR - Surveillance automatique

on:
workflow_dispatch:
schedule:
- cron: "*/5 * * * *"

permissions:
contents: write

concurrency:
group: bot-worker
cancel-in-progress: false

jobs:
monitor:
runs-on: ubuntu-latest
timeout-minutes: 10

steps:
  - name: Télécharger le dépôt
    uses: actions/checkout@v4
    with:
      token: ${{ github.token }}

  - name: Installer Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Vérifier les fichiers
    run: |
      test -f db.json
      test -f manus_monitor.py

  - name: Surveiller les tâches Manus
    env:
      MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    run: python manus_monitor.py

  - name: Sauvegarder les résultats
    run: |
      git config user.name "BOT WORKER"
      git config user.email "bot-worker@users.noreply.github.com"
      git add db.json
      git diff --cached --quiet || git commit -m "BOT WORKER: Manus monitoring update"
      git push